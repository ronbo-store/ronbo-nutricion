name: Batería reglas FotoDoc (emulador)
run-name: "Batería FotoDoc · ${{ github.ref_name }} · ${{ github.sha }}"
on:
  push:
    branches: [ci/fotodoc-bateria]
permissions:
  contents: read
jobs:
  bateria:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-fotodoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests-fotodoc/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm install -g firebase-tools@15.34.0
      # Un paso por GRUPO de casos y por suite: la conclusión de cada
      # paso (visible en la API de la corrida) dice qué grupo falló.
      - name: CAND G1 creación C1–C7
        if: always()
        run: |
          cp reglas-candidatas.txt firestore.rules
          CASOS=C1,C2,C3,C4,C5,C6,C7 ESPERA_NUEVO=true firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fotodoc.mjs" > salida-cand-g1.log 2>&1
      - name: CAND G2 creación C8–C14
        if: always()
        run: |
          cp reglas-candidatas.txt firestore.rules
          CASOS=C8,C9,C10,C11,C12,C13,C14 ESPERA_NUEVO=true firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fotodoc.mjs" > salida-cand-g2.log 2>&1
      - name: CAND G3 actualización U1–U6 (sin U4)
        if: always()
        run: |
          cp reglas-candidatas.txt firestore.rules
          CASOS=U1,U2,U3,U5,U6 ESPERA_NUEVO=true firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fotodoc.mjs" > salida-cand-g3.log 2>&1
      - name: CAND G4 aprobación, lectura, borrado y sonda
        if: always()
        run: |
          cp reglas-candidatas.txt firestore.rules
          CASOS=U4,R1,R2,R3,R4,X1,D1 ESPERA_NUEVO=true firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fotodoc.mjs" > salida-cand-g4.log 2>&1
      - name: CTRL G1 creación C1–C7
        if: always()
        run: |
          cp reglas-vivas.txt firestore.rules
          CASOS=C1,C2,C3,C4,C5,C6,C7 ESPERA_NUEVO=false firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fotodoc.mjs" > salida-ctrl-g1.log 2>&1
      - name: CTRL G2 creación C8–C14
        if: always()
        run: |
          cp reglas-vivas.txt firestore.rules
          CASOS=C8,C9,C10,C11,C12,C13,C14 ESPERA_NUEVO=false firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fotodoc.mjs" > salida-ctrl-g2.log 2>&1
      - name: CTRL G3 actualización U1–U6 (sin U4)
        if: always()
        run: |
          cp reglas-vivas.txt firestore.rules
          CASOS=U1,U2,U3,U5,U6 ESPERA_NUEVO=false firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fotodoc.mjs" > salida-ctrl-g3.log 2>&1
      - name: CTRL G4 aprobación, lectura, borrado y sonda
        if: always()
        run: |
          cp reglas-vivas.txt firestore.rules
          CASOS=U4,R1,R2,R3,R4,X1,D1 ESPERA_NUEVO=false firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fotodoc.mjs" > salida-ctrl-g4.log 2>&1
      - name: Veredicto (las 8 corridas de grupo en verde)
        if: always()
        run: |
          echo "líneas OK de candidata: $(grep -l 'BATERÍA FOTODOC OK — CANDIDATA' salida-cand-g*.log | wc -l) / 4"
          echo "líneas OK de control:   $(grep -l 'BATERÍA FOTODOC OK — VIVAS' salida-ctrl-g*.log | wc -l) / 4"
          test "$(grep -l 'BATERÍA FOTODOC OK — CANDIDATA' salida-cand-g*.log | wc -l)" = "4"
          test "$(grep -l 'BATERÍA FOTODOC OK — VIVAS' salida-ctrl-g*.log | wc -l)" = "4"
