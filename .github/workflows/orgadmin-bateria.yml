# RONBO FIT — Batería de reglas del delta «Organización de
# Administración» (2026-10-28): captura de la bitácora ND-2 por
# el entrenador asignado. REBASE 2026-10-29 para el despliegue:
# la suite ORGADMIN (16 casos L1–L16) contra el CANDIDATO
# REBASEADO (texto vivo cba128f2…, ruleset 544fc61e, + SOLO la
# rama del entrenador aprobado y asignado en el allow create de
# match /access_log/{logId}; candidato rebaseado SHA-256
# ff4691cd…) y la MISMA suite contra el texto VIVO ACTUAL
# (cba128f2…) con la expectativa de L2 invertida (el contraste). Todo contra el
# emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test). Este workflow SOLO valida el texto; NO
# publica reglas ni despliega nada. Sin secretos, sin
# credenciales de producción.
#
# Colocación: este archivo va en .github/workflows/ del repo CI
# y las suites en pruebas-reglas-orgadmin/ y
# pruebas-reglas-orgadmin-vivo/ en la raíz del mismo repo, en
# la rama ci/orgadmin-bateria.
name: Batería Organización Admin — Bitácora ND-2 (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/orgadmin-bateria-rebase]

permissions:
  contents: read

jobs:
  orgadmin-candidato:
    name: Serie ORGADMIN (16 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-orgadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-orgadmin.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie ORGADMIN (16 casos) contra el CANDIDATO — resultado'
            grep -E 'ORGADMIN-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

  orgadmin-vivo:
    name: Serie ORGADMIN (16 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-orgadmin-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-orgadmin.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie ORGADMIN (16 casos) contra el texto VIVO — resultado'
            grep -E 'ORGADMIN-VIVO' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
