# RONBO FIT — Batería oficial del capítulo de reglas «Coach de
# alimentación» (punto 101 de la cola) en el emulador oficial de
# Firestore (proyecto ficticio ronbo-nutri-test): suites gemelas
# contra la CANDIDATA y contra el texto VIVO, con las expectativas
# del capítulo nuevo invertidas en el vivo. Sin secretos, sin
# credenciales de producción, sin despliegue: la publicación de
# reglas va por la ruta probada (CLI con token, desde la carpeta
# del paquete), nunca desde este workflow.
name: Batería coach (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/coach-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 80 casos x2 (candidata y vivo) contra el emulador oficial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Suite CANDIDATA (el capítulo se comporta como se diseñó)
        run: |
          cp firestore.rules.candidata firestore.rules
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=true node test-coach.mjs"
      - name: Suite VIVO (el capítulo no existe; vecinos idénticos)
        run: |
          cp firestore.rules.viva firestore.rules
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=false node test-coach.mjs"
