# RONBO NUTRI — Batería oficial de reglas del CUESTIONARIO v1 en el
# emulador oficial de Firestore (proyecto ficticio
# demo-cuestionario-v1). Autorización S2 de Ronald (16/10/2026).
# Sin secretos, sin credenciales de producción, sin despliegue:
# solo valida las reglas candidatas contra datos ficticios.
name: Batería Cuestionario v1 (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/cuestionario-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 33 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-cuestionario
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-cuestionario-v1 "node bateria.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-cuestionario
          path: |
            tests-cuestionario/resultado-bateria.txt
            tests-cuestionario/firestore-debug.log
          retention-days: 7
