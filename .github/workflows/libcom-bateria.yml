# RONBO NUTRI — Batería de reglas del delta «Biblioteca comunitaria
# con aprobación»: 45 casos contra el emulador oficial de Firestore
# (proyecto ficticio ronbo-nutri-test), en la vía CI del proyecto. El
# texto probado es el CANDIDATO de publicación del paquete: texto vivo
# verificado b135f2f8 (reglas-vivas-verificadas-2026-10-24-n09-
# rediseno.rules) + SOLO el delta de biblioteca comunitaria,
# compuesto por preparacion-local/build-candidato-biblioteca-
# comunitaria.py: preparacion-local/firestore.rules.candidato-
# biblioteca-comunitaria-2026-10-24.rules, SHA-256
# 75c2033ffb8799f4afe2c4aaada90e4c6094a7906bb7ce1fa8cf7e61f590a775.
# Decisión de Ronald (chat RONBO.NUTRI, 2026-10-24 20:57 CDT): el
# entrenador crea ejercicios, el administrador los aprueba, y
# aprobados sirven a toda la comunidad con su marca de autoría.
# Este workflow SOLO valida el texto; NO publica reglas ni despliega
# nada. Sin secretos, sin credenciales de producción.
name: Batería Biblioteca Comunitaria (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/libcom-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: Casos Biblioteca Comunitaria contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-libcom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-libcom.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería Biblioteca Comunitaria — resultado'
            grep -E 'BIBLIOTECA COMUNITARIA:' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL — ' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el detalle como anotaciones (legibles por API pública)
        if: always()
        shell: bash
        run: |
          grep -E 'BIBLIOTECA COMUNITARIA:' resultado-bateria.txt | sed 's/^/::notice title=RESULTADO::/' || true
          grep -E '^FAIL — ' resultado-bateria.txt | sed 's/^FAIL — /::error title=FAIL::/' || true
          echo "::error title=HEAD::$(head -c 800 resultado-bateria.txt | tr '\n' '|')" || true
          echo "::error title=TAIL::$(tail -c 1200 resultado-bateria.txt | tr '\n' '|')" || true
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-biblioteca-comunitaria
          path: |
            pruebas-reglas-libcom/resultado-bateria.txt
            pruebas-reglas-libcom/firestore-debug.log
          retention-days: 7
