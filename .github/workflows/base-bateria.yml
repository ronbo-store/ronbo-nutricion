name: Batería de reglas — delta ecuación automática (D1)

# Batería del delta de reglas de la SIMPLIFICACIÓN DE LA BASE
# (punto 106 de la cola de despliegue 2026-11-01, decisión D1):
# la sesión del propio alumno puede hacer NACER la ecuación
# automática ('mifflin-st-jeor' + equationOrigin 'auto', solo
# sin equationChosenBy previo) y el entrenador estampa
# equationOrigin 'trainer'. Delta APROBADO por Ronald el
# 2026-11-02 (correo 19:12 CST condicionado a la maqueta;
# maqueta entregada y aprobada en el chat 21:17 CST;
# autorización permanente 2026-10-29). Corre SOLO en esta rama
# de CI: el emulador oficial de Firestore contra la CANDIDATA
# (pruebas-reglas-base/firestore.rules, SHA-256 e282f695…) y
# contra el TEXTO VIVO (pruebas-reglas-base-vivo/firestore.rules,
# ruleset 2446cb1d, SHA-256 80f5babf…) con las expectativas del
# delta invertidas. Nada toca producción.
# Forma calcada de la batería de AUTH-175 (daySummary), la que
# sí corre en esta casa: reglas dentro de cada suite y npm ci.

on:
  push:
    branches: [ci/base-bateria]
    paths:
      - 'pruebas-reglas-base/**'
      - 'pruebas-reglas-base-vivo/**'
      - 'firestore.rules.candidata'
      - 'firestore.rules.viva-antes'
      - '.github/workflows/base-bateria.yml'
  workflow_dispatch:

jobs:
  base-candidato:
    name: Serie BASE (15 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-base.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie BASE (15 casos) contra el CANDIDATO — resultado'
            grep -E 'BASE-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emitir los fallos como anotaciones (legibles por API)
        if: always()
        shell: bash
        run: |
          grep -E '^FAIL' resultado-bateria.txt | while IFS= read -r l; do echo "::error title=CASO-FAIL::$l"; done || true
          grep -E 'BASE-[A-Z]+:' resultado-bateria.txt | while IFS= read -r l; do echo "::notice title=TOTAL::$l"; done || true
      - name: Publicar el detalle como estado del commit (legible por API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL=$(grep -E 'BASE-CANDIDATO:' resultado-bateria.txt | tail -1 || true)
          CODES=$(grep -E '^FAIL' resultado-bateria.txt | grep -oE 'EQ[0-9]+' | sort -u | tr '\n' ' ' || true)
          DESC="$TOTAL | FAIL: ${CODES:-ninguno}"
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          if grep -qE 'BASE-CANDIDATO: [0-9]+/[0-9]+ PASS' resultado-bateria.txt && ! grep -qE '^FAIL' resultado-bateria.txt; then ST=success; else ST=failure; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$ST\",\"context\":\"bateria-base/candidato\",\"description\":\"$DESC\"}" > /dev/null || true

  base-vivo:
    name: Serie BASE (15 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-base-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-base.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie BASE (15 casos) contra el texto VIVO — resultado'
            grep -E 'BASE-VIVO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emitir los fallos como anotaciones (legibles por API)
        if: always()
        shell: bash
        run: |
          grep -E '^FAIL' resultado-bateria.txt | while IFS= read -r l; do echo "::error title=CASO-FAIL::$l"; done || true
          grep -E 'BASE-[A-Z]+:' resultado-bateria.txt | while IFS= read -r l; do echo "::notice title=TOTAL::$l"; done || true
      - name: Publicar el detalle como estado del commit (legible por API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL=$(grep -E 'BASE-VIVO:' resultado-bateria.txt | tail -1 || true)
          CODES=$(grep -E '^FAIL' resultado-bateria.txt | grep -oE 'EQ[0-9]+' | sort -u | tr '\n' ' ' || true)
          DESC="$TOTAL | FAIL: ${CODES:-ninguno}"
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          if grep -qE 'BASE-VIVO: [0-9]+/[0-9]+ PASS' resultado-bateria.txt && ! grep -qE '^FAIL' resultado-bateria.txt; then ST=success; else ST=failure; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$ST\",\"context\":\"bateria-base/vivo\",\"description\":\"$DESC\"}" > /dev/null || true
