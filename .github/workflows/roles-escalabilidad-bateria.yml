# RONBO NUTRI — Batería de reglas de Roles + Escalabilidad
# 50 casos contra el emulador oficial de Firestore (proyecto
# ficticio ronbo-nutri-test), en la vía CI del proyecto (la misma
# que validó el candidato P8, la mitigación S-1, el somatotipo,
# la actividad y el control de IA). El texto probado es el FINAL
# compuesto para producción: texto vivo verificado 0ee08b7e
# (2026-10-24) + SOLO el delta de Roles + Escalabilidad con
# modality_requests (punto 9):
# preparacion-local/firestore.rules.candidato-roles-final-2026-10-24.rules,
# SHA-256 1cf15fdc2beeadae14ddb982f25e61ac42b17bab36d325f74c26420a58aa1eda.
# Despliegue autorizado por Ronald por correo (memphis) el
# 2026-10-24 14:40 y 14:56 CDT («Autorizo el despliegue de
# Roles + Escalabilidad en su orden obligatorio» / «Confirmo
# directo: DESPLIEGA Roles + Escalabilidad»,
# AUTH-2026-10-24-013); este workflow SOLO valida el texto; no
# publica reglas ni despliega nada.
# Sin secretos, sin credenciales de producción, sin despliegue.
name: Batería roles-escalabilidad (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/roles-escalabilidad-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 50 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-roles-escalabilidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-roles-escalabilidad.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería roles-escalabilidad — resultado'
            grep -E 'RESULTADO:' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL — ' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el detalle como anotaciones (legibles por API pública)
        if: always()
        shell: bash
        run: |
          grep -E 'RESULTADO:' resultado-bateria.txt | sed 's/^/::notice title=RESULTADO::/' || true
          grep -E '^FAIL — ' resultado-bateria.txt | sed 's/^FAIL — /::error title=FAIL::/' || true
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-roles-escalabilidad
          path: |
            pruebas-reglas-roles-escalabilidad/resultado-bateria.txt
            pruebas-reglas-roles-escalabilidad/firestore-debug.log
          retention-days: 7
