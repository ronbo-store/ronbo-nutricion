# RONBO NUTRI — Batería de reglas del registro de actividad
# 32 casos contra el emulador oficial de Firestore (proyecto
# ficticio ronbo-nutri-test), en la vía CI del proyecto (la misma
# que validó el candidato P8, la mitigación S-1 y el somatotipo).
# El texto probado es el FINAL compuesto para producción: texto
# vivo tras el somatotipo (ruleset 161d70a3) + SOLO las adiciones
# de actividad (helpers actKeysOk/actShapeOk + match
# /activity_logs/{docId}): preparacion-local/
# firestore.rules.candidato-actividad-final-2026-10-24.rules,
# SHA-256 d94931bc4b507fff3781abd33d78c114f9786710623903001fc097bbd7f24f2f.
# Despliegue autorizado por Ronald el 2026-10-24 («Autorizo el
# despliegue», AUTH-2026-10-24-011); este workflow SOLO valida el
# texto; no publica reglas ni despliega nada.
# Sin secretos, sin credenciales de producción, sin despliegue.
name: Batería actividad (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/actividad-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 32 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: actividad-2026-10-24/pruebas-reglas-actividad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-actividad.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería actividad — resultado'
            grep -E 'RESULTADO ACTIVIDAD-REGLAS' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL — ' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-actividad
          path: |
            actividad-2026-10-24/pruebas-reglas-actividad/resultado-bateria.txt
            actividad-2026-10-24/pruebas-reglas-actividad/firestore-debug.log
          retention-days: 7
