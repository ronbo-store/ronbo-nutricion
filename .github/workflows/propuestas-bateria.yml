name: bateria-propuestas

# Batería de reglas del Paquete 7 (propuestas del cliente):
# corre SOLO cuando cambia la suite de tests-propuestas/** o
# este workflow, en la rama ci/propuestas-bateria. Prueba contra
# la COPIA EXACTA del texto vivo verificado (ruleset 2a1e98c1)
# que la casa de datos de las propuestas (nutrition_progress,
# kind 'planProposal') funciona para ambos roles sin tocar
# reglas. NO despliega la app, NO publica reglas, NO toca
# producción: solo levanta el emulador oficial de Firestore en
# el runner y ejecuta la batería contra él.

on:
  push:
    branches: [ci/propuestas-bateria]
    paths:
      - 'tests-propuestas/**'
      - '.github/workflows/propuestas-bateria.yml'
  workflow_dispatch:

jobs:
  bateria:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-propuestas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar dependencias de la batería
        run: npm ci --no-audit --no-fund
      - name: Instalar firebase-tools (emulador oficial)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador
        run: firebase emulators:exec --only firestore --project demo-propuestas "node bateria.mjs" 2>&1 | tee bateria.log
      - name: Publicar el conteo en el resumen del run
        if: always()
        run: |
          {
            echo '## Batería de reglas — Paquete 7 · propuestas (texto vivo 2a1e98c1, sin candidato)'
            echo ''
            grep -E '^(SUBTOTAL|RESULTADO)' bateria.log || echo 'Sin líneas de conteo (¿falló el arranque?)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Subir la evidencia (log completo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-propuestas
          path: tests-propuestas/bateria.log
          retention-days: 7
          if-no-files-found: warn
