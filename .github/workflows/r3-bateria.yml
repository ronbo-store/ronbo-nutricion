# RONBO NUTRI — Batería oficial del CANDIDATO r3 (recibos A2) en el
# emulador oficial de Firestore (proyecto ficticio demo-recibos-r3).
# Autorización A2/B2 de Ronald (16/10/2026). Sin secretos, sin
# credenciales de producción, sin despliegue.
name: Batería r3 (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/cuestionario-r3]

permissions:
  contents: read

jobs:
  bateria:
    name: 62 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-r3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-recibos-r3 "node bateria.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-r3
          path: |
            tests-r3/resultado-bateria.txt
            tests-r3/firestore-debug.log
          retention-days: 7
