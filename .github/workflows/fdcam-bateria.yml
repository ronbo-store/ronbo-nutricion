# RONBO FIT — Batería de reglas del delta AUTH-2026-10-28-071
# «Puerta falsa Camera Coach» (diseño aprobado por Ronald el
# 2026-10-28): la suite FDCAM (10 casos F1–F10) contra el
# CANDIDATO de reglas (texto AUTH-068 ya publicado, SHA-256
# 9d7dd0b3…, + SOLO el delta fdCamAt: hasOnly de la rama de
# perfil inofensivo con guarda de tipo cadena y la línea que lo
# prohíbe en el create del registro; candidato SHA-256
# b71d4fd4…) y la MISMA suite contra el texto VIVO con las
# expectativas del delta invertidas (el contraste). Todo contra
# el emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test). Este workflow SOLO valida el texto; NO
# publica reglas ni despliega nada. Sin secretos, sin
# credenciales de producción.
#
# Colocación: este archivo va en .github/workflows/ del repo CI
# y las suites en pruebas-reglas-fdcam/ y
# pruebas-reglas-fdcam-vivo/ en la raíz del mismo repo, en la
# rama ci/fdcam-bateria.
name: Batería AUTH-071 Puerta falsa Camera Coach (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/fdcam-bateria]

permissions:
  contents: read

jobs:
  fdcam-candidato:
    name: Serie FDCAM (10 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-fdcam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fdcam.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie FDCAM (10 casos) contra el CANDIDATO — resultado'
            grep -E 'FDCAM-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

  fdcam-vivo:
    name: Serie FDCAM (10 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-fdcam-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fdcam.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie FDCAM (10 casos) contra el texto VIVO — resultado'
            grep -E 'FDCAM-VIVO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
