# RONBO FIT — Batería oficial del delta de reglas «campo lang»
# (AUTH-2026-11-03-197) en el emulador oficial de Firestore
# (proyecto ficticio ronbo-nutri-test): suites gemelas contra la
# CANDIDATA y contra el texto VIVO, con las expectativas del
# campo nuevo invertidas en el vivo. Sin secretos, sin
# credenciales de producción, sin despliegue: la publicación de
# reglas va por la ruta probada (CLI con token, desde la carpeta
# del paquete), nunca desde este workflow.
name: Batería correo-idioma (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/correo-idioma-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 11 casos x2 (candidata y vivo) contra el emulador oficial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-correo-idioma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Suite CANDIDATA (el campo lang se comporta como se diseñó)
        run: |
          cp firestore.rules.candidata firestore.rules
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=true node test-correo-idioma.mjs"
      - name: Suite VIVO (lang no existe en la lista; vecinos idénticos)
        run: |
          cp firestore.rules.viva firestore.rules
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=false node test-correo-idioma.mjs"
