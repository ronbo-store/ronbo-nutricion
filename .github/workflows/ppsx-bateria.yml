# RONBO FIT — Batería de reglas del delta N-2 «ppSymptoms»
# FRENTE 1 Paquete A (decisión de Ronald 2026-10-30 02:58 CDT:
# la respuesta de síntomas del posparto se persiste, con su
# ajuste de reglas propio). La suite PPSX (11 casos) contra el
# CANDIDATO de reglas (texto vivo ruleset 0c01e832, SHA-256
# 3e3c5ea1…, + SOLO el delta ppSymptoms en healthDeclarations:
# 'ppSymptoms' en la lista cerrada de la rama de actualización
# + guarda de forma ['si','no','omitida'] en create y update;
# candidato SHA-256 77736abe…) y la MISMA suite contra el texto
# VIVO con las expectativas del delta invertidas (el contraste).
# Todo contra el emulador oficial de Firestore (proyecto
# ficticio ronbo-nutri-test). Este workflow SOLO valida el
# texto; NO publica reglas ni despliega nada. Sin secretos,
# sin credenciales de producción.
#
# Colocación: este archivo va en .github/workflows/ del repo y
# las suites en pruebas-reglas-ppsx/ y pruebas-reglas-ppsx-vivo/
# en la raíz del mismo repo, en la rama ci/frente1-ppsx-bateria.
name: Batería FRENTE 1 N-2 ppSymptoms (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/frente1-ppsx-bateria]

permissions:
  contents: read

jobs:
  ppsx-candidato:
    name: Serie PPSX (11 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-ppsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-ppsx.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie PPSX (11 casos) contra el CANDIDATO — resultado'
            grep -E 'PPSX-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

  ppsx-vivo:
    name: Serie PPSX (11 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-ppsx-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-ppsx.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie PPSX (11 casos) contra el texto VIVO — resultado'
            grep -E 'PPSX-VIVO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
