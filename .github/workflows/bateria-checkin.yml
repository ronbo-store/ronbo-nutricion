# RONBO FIT — Batería oficial del delta de reglas «CHECK-IN
# SEMANAL» (AUTH-2026-11-10-367) en el emulador oficial de
# Firestore (proyecto ficticio ronbo-nutri-test): suites gemelas
# contra la CANDIDATA y contra el texto VIVO f7d47e8b, con las
# expectativas del delta invertidas en el vivo. Sin secretos,
# sin credenciales de producción, sin despliegue: la
# publicación de reglas va por la ruta probada (API oficial con
# token del propietario, desde la carpeta del paquete), nunca
# desde este workflow.
# La salida de cada suite se vuelca como anotaciones del job
# para poder leerla sin descargar registros.
name: Batería Check-in Semanal (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/checkin-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 32 casos x2 (candidata y vivo) contra el emulador oficial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-checkin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Suite CANDIDATA (el delta se comporta como se diseñó)
        run: |
          cp firestore.rules.candidata firestore.rules
          set +e
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=true node test-checkin.mjs" > suite-cand.log 2>&1
          echo $? > rc-cand.txt
          tail -n 5 suite-cand.log
          true
      - name: Informe CANDIDATA (anotaciones)
        if: always()
        run: |
          if [ -f fallos.txt ]; then
            while IFS= read -r linea; do echo "::error title=FALLO-CAND::${linea:0:240}"; done < fallos.txt
            rm -f fallos.txt
          fi
          tail -n 40 suite-cand.log | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r linea; do echo "::error title=LOGCAND::${linea:0:240}"; done
          true
      - name: Suite CONTROL (texto vivo f7d47e8b, delta invertido)
        if: always()
        run: |
          cp firestore.rules.viva firestore.rules
          set +e
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=false node test-checkin.mjs" > suite-viva.log 2>&1
          echo $? > rc-viva.txt
          tail -n 5 suite-viva.log
          true
      - name: Informe VIVO (anotaciones)
        if: always()
        run: |
          if [ -f fallos.txt ]; then
            while IFS= read -r linea; do echo "::error title=FALLO-VIVO::${linea:0:240}"; done < fallos.txt
            rm -f fallos.txt
          fi
          tail -n 40 suite-viva.log | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r linea; do echo "::error title=LOGVIVO::${linea:0:240}"; done
          true
      - name: Veredicto (falla si alguna suite falló)
        if: always()
        run: |
          echo "rc-cand=$(cat rc-cand.txt 2>/dev/null || echo '?') rc-viva=$(cat rc-viva.txt 2>/dev/null || echo '?')"
          test "$(cat rc-cand.txt)" = "0" && test "$(cat rc-viva.txt)" = "0"
