# RONBO FIT — Batería oficial del delta de reglas «EL AGUA DE LOS
# ALUMNOS SE GUARDA» (AUTH-2026-11-06-277) en el emulador oficial de
# Firestore (proyecto ficticio ronbo-nutri-test): suites gemelas
# contra la CANDIDATA y contra el texto VIVO 326e414e, con las
# expectativas del delta invertidas en el vivo. Sin secretos, sin
# credenciales de producción, sin despliegue: la publicación de
# reglas va por la ruta probada (CLI con token, desde la carpeta del
# paquete), nunca desde este workflow.
# INSTALACIÓN: este archivo va en .github/workflows/ de un worktree
# ci/* junto a una carpeta tests-agua/ con el contenido de la carpeta
# reglas/ del paquete (package.json, package-lock.json,
# firebase.json, test-agua.mjs, firestore.rules.candidata y
# firestore.rules.viva).
name: Batería AguaAlumnos (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/agua-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 12 casos x2 (candidata y vivo) contra el emulador oficial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-agua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Suite CANDIDATA (el delta se comporta como se diseñó)
        run: |
          cp firestore.rules.candidata firestore.rules
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=true node test-agua.mjs"
      - name: Fallos de la CANDIDATA (anotaciones)
        if: always()
        run: |
          if [ -f fallos.txt ]; then
            while IFS= read -r linea; do echo "::error title=FALLO-CAND::$linea"; done < fallos.txt
            rm -f fallos.txt
          else
            echo "::notice title=CAND::sin archivo de fallos"
          fi
      - name: Suite CONTROL (texto vivo 326e414e, delta invertido)
        run: |
          cp firestore.rules.viva firestore.rules
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=false node test-agua.mjs"
      - name: Fallos del VIVO (anotaciones)
        if: always()
        run: |
          if [ -f fallos.txt ]; then
            while IFS= read -r linea; do echo "::error title=FALLO-VIVO::$linea"; done < fallos.txt
            rm -f fallos.txt
          else
            echo "::notice title=VIVO::sin archivo de fallos"
          fi
