# RONBO NUTRI — Batería de reglas del delta POOL DE
# ENTRENADORES VISIBLE PARA EL ALUMNO (2026-10-27,
# AUTH-2026-10-27-041): la suite NUEVA Pool (14 casos +
# 2 verificaciones de datos) contra el candidato, la MISMA suite
# contra el texto VIVO con la expectativa invertida en P2/P13
# (el contraste), MÁS la regresión completa de las suites
# vigentes: Metas-L §L (45), Metas A/G (45), Biblioteca
# Comunitaria (45), Línea Completa (49) y S-1 (17). Todo contra
# el emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test). El texto probado en las regresiones es el
# MISMO candidato: texto vivo verificado a4435194 (SHA-256
# 08d90807...) + SOLO el delta memberships get para el usuario
# aprobado (candidato SHA-256 c7d039bb...). Este workflow SOLO
# valida el texto; NO publica reglas ni despliega nada. Sin
# secretos, sin credenciales de producción.
name: Batería Pool de Entrenadores (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/pool-bateria]

permissions:
  contents: read

jobs:
  pool:
    name: Serie Pool (14 casos + 2 datos) contra el CANDIDATO (emulador oficial, proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-pool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-pool.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie Pool (14 casos + 2 datos) contra el CANDIDATO (emulador oficial, proyecto ficticio) — resultado'
            grep -E 'POOL:' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el detalle como anotaciones (legibles por API pública)
        if: always()
        shell: bash
        run: |
          grep -E 'POOL:' resultado-bateria.txt | sed 's/^/::notice title=RESULTADO::/' || true
          grep -E '^FAIL' resultado-bateria.txt | sed 's/^FAIL — /::error title=FAIL::/' || true
          echo "::error title=HEAD::$(head -c 800 resultado-bateria.txt | tr '\n' '|')" || true
          echo "::error title=TAIL::$(tail -c 1200 resultado-bateria.txt | tr '\n' '|')" || true
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-pool
          path: |
            pruebas-reglas-pool/resultado-bateria.txt
            pruebas-reglas-pool/firestore-debug.log
          retention-days: 7

