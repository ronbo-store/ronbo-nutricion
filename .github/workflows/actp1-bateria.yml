# RONBO FIT — Batería oficial del delta de reglas «Integración
# de actividad, Paquete 1» (consentimiento por tipo con recibos
# derivados + colección activity_data solo-sueño con la compuerta
# del entrenador) en el emulador oficial de Firestore (proyecto
# ficticio ronbo-nutri-test): suites gemelas contra la CANDIDATA
# y contra el texto VIVO, con las expectativas de lo nuevo
# invertidas en el vivo. Sin secretos, sin credenciales de
# producción, sin despliegue: la publicación de reglas va por la
# ruta probada (CLI con token, desde la carpeta del paquete),
# nunca desde este workflow.
# Nota de operación: el paso final publica la salida completa de
# ambas suites en la rama ci/actp1-resultados (archivo
# tests-actp1/resultado-ultima-corrida.txt) porque los registros
# de Actions no son legibles desde la máquina de trabajo (la API
# exige derechos de administración); esa rama no dispara este
# workflow.
name: Batería actp1 (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/actp1-bateria]

permissions:
  contents: write

jobs:
  bateria:
    name: 35 casos x2 (candidata y vivo) contra el emulador oficial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-actp1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Suite CANDIDATA (el consentimiento por tipo y el sueño se comportan como se diseñó)
        run: |
          cp firestore.rules.candidata firestore.rules
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=true node test-actp1.mjs" 2>&1 | tee /tmp/suite-candidata.log
      - name: Suite VIVO (sin ramas de actividad; activity_data no existe; vecinos idénticos)
        if: always()
        run: |
          cp firestore.rules.viva firestore.rules
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=false node test-actp1.mjs" 2>&1 | tee /tmp/suite-vivo.log
      - name: Sonda (variante sin derivación de actividad en receiptType)
        if: always()
        working-directory: tests-actp1
        run: |
          cp firestore.rules.candidata firestore.rules
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-variante.mjs" 2>&1 | tee /tmp/sonda.log || true
      - name: Sondas de bisección (variantes A, B y C)
        if: always()
        working-directory: tests-actp1
        run: |
          python3 make-variantes.py
          for v in A B C; do
            cp firestore.rules.var$v firestore.rules
            echo "════ VARIANTE $v ════" >> /tmp/biseccion.log
            firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-variante.mjs" 2>&1 | grep -a "SONDA" >> /tmp/biseccion.log || true
          done
          cat /tmp/biseccion.log
      - name: Publicar resultados en la rama de resultados
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/resrepo
          git clone --depth 1 --branch ci/actp1-resultados "https://x-access-token:${GH_TOKEN}@github.com/ronbo-store/ronbo-nutricion.git" /tmp/resrepo 2>/dev/null \
            || git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/ronbo-store/ronbo-nutricion.git" /tmp/resrepo
          cd /tmp/resrepo
          git checkout -B ci/actp1-resultados
          mkdir -p tests-actp1
          {
            echo "Corrida: ${{ github.run_id }} · ${{ github.sha }} · $(date -u +%FT%TZ)"
            echo "══════════ SUITE CANDIDATA ══════════"
            cat /tmp/suite-candidata.log 2>/dev/null || echo "(sin salida)"
            echo "══════════ SUITE VIVO ══════════"
            cat /tmp/suite-vivo.log 2>/dev/null || echo "(sin salida)"
            echo "══════════ SONDA ══════════"
            grep -a "SONDA" /tmp/sonda.log 2>/dev/null || echo "(sin sonda)"
            echo "══════════ BISECCIÓN ══════════"
            cat /tmp/biseccion.log 2>/dev/null || echo "(sin bisección)"
          } > tests-actp1/resultado-ultima-corrida.txt
          git config user.email "ci@ronbo.local"
          git config user.name "CI bateria actp1"
          git add tests-actp1/resultado-ultima-corrida.txt
          git commit -m "Resultados batería actp1 (corrida ${{ github.run_id }}) [skip ci]" || echo "sin cambios"
          git push origin HEAD:ci/actp1-resultados
