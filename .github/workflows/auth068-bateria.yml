# RONBO NUTRI — Batería de reglas del delta AUTH-2026-10-28-068
# «Registro y aprobación en un clic» (diseño 2026-10-28, §4 y
# §8.1): la suite NUEVA Auth068 (10 casos) contra el candidato,
# la MISMA suite contra el texto VIVO con las expectativas del
# delta invertidas (el contraste), MÁS la regresión de las
# suites incluidas en esta batería: Metas-L §L (45), Metas A/G
# (45), Biblioteca Comunitaria (45), Línea Completa (49) y S-1
# (17). Todo contra el emulador oficial de Firestore (proyecto
# ficticio ronbo-nutri-test). El texto probado en las
# regresiones es el MISMO candidato: texto vivo verificado
# ec2963ec (SHA-256 4237d9cc...) + SOLO el delta AUTH-068 de 2
# ediciones ('emailConfirmedAt' en la rama de perfil inofensivo
# con valor == hora del servidor, y la línea que lo prohíbe en
# el create del registro; candidato SHA-256 9d7dd0b3...). Este
# workflow SOLO valida el texto; NO publica reglas ni despliega
# nada. Sin secretos, sin credenciales de producción.
name: Batería AUTH-068 Registro y aprobación (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/auth068-bateria]

permissions:
  contents: read

jobs:
  auth068:
    name: Serie AUTH068 (10 casos) contra el CANDIDATO (emulador oficial, proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-auth068
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-auth068.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie AUTH068 (10 casos) contra el CANDIDATO (emulador oficial, proyecto ficticio) — resultado'
            grep -E 'AUTH068:' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el detalle como anotaciones (legibles por API pública)
        if: always()
        shell: bash
        run: |
          grep -E 'AUTH068:' resultado-bateria.txt | sed 's/^/::notice title=RESULTADO::/' || true
          grep -E '^FAIL' resultado-bateria.txt | sed 's/^FAIL — /::error title=FAIL::/' || true
          echo "::error title=HEAD::$(head -c 800 resultado-bateria.txt | tr '\n' '|')" || true
          echo "::error title=TAIL::$(tail -c 1200 resultado-bateria.txt | tr '\n' '|')" || true
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-auth068
          path: |
            pruebas-reglas-auth068/resultado-bateria.txt
            pruebas-reglas-auth068/firestore-debug.log
          retention-days: 7

