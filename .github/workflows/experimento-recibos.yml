# RONBO NUTRI — EXPERIMENTO AISLADO C2: integridad bidireccional
# de recibos SOLO con reglas nativas (proyecto ficticio
# demo-recibos-c2). Autorización de verificación de Ronald
# (16/10/2026). Sin secretos, sin producción, sin despliegue.
name: Experimento C2 — recibos bidireccionales (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/experimento-recibos-c2]

permissions:
  contents: read

jobs:
  experimento:
    name: 23 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experimento-recibos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar el experimento contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-recibos-c2 "node experimento.mjs" 2>&1 | tee resultado-experimento.txt
      - name: Conservar la evidencia (salida del experimento)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-experimento-recibos
          path: |
            experimento-recibos/resultado-experimento.txt
            experimento-recibos/firestore-debug.log
          retention-days: 7
