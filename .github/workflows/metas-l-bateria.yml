# RONBO NUTRI — Batería de reglas del delta METAS-L (§L,
# 2026-10-26): 45 casos NUEVOS (serie L) contra el candidato de
# publicación, MÁS la regresión completa de las suites vigentes:
# Metas A/G (45), Biblioteca Comunitaria (45), Línea Completa (49)
# y S-1 (17). Todo contra el emulador oficial de Firestore
# (proyecto ficticio ronbo-nutri-test). El texto probado en las
# CINCO suites es el MISMO candidato: texto vivo verificado
# cd47f337 (SHA-256 dd25a14f1dd6d75492954d3d056be61d84fd55c2ddb1c2a238fbcda83747b0c5)
# + SOLO el delta §L (preparacion-local/
# firestore.rules.candidato-metas-l-2026-10-26.rules, SHA-256
# e5e9452f6598838fead24a64ab2bff383b94ca3541afe8065143e796c92fbcbd).
# Este workflow SOLO valida el texto; NO publica reglas ni
# despliega nada. Sin secretos, sin credenciales de producción.
name: Batería Metas-L §L (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/metas-l-bateria]

permissions:
  contents: read

jobs:
  metas-l:
    name: Serie Metas-L §L (45 casos) contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-metas-l
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-metas-l.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería Metas-L §L — resultado'
            grep -E 'METAS-L' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL — ' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el detalle como anotaciones (legibles por API pública)
        if: always()
        shell: bash
        run: |
          grep -E 'METAS-L' resultado-bateria.txt | sed 's/^/::notice title=RESULTADO::/' || true
          grep -E '^FAIL — ' resultado-bateria.txt | sed 's/^FAIL — /::error title=FAIL::/' || true
          echo "::error title=HEAD::$(head -c 800 resultado-bateria.txt | tr '\n' '|')" || true
          echo "::error title=TAIL::$(tail -c 1200 resultado-bateria.txt | tr '\n' '|')" || true
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-metas-l
          path: |
            pruebas-reglas-metas-l/resultado-bateria.txt
            pruebas-reglas-metas-l/firestore-debug.log
          retention-days: 7

  regresion-metas:
    name: Regresión Metas A/G (45 casos) contra el MISMO candidato
