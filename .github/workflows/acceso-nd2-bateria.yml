# RONBO NUTRI — Batería del CANDIDATO COMPARADOR ND-2 (2026-10-22):
# la suite íntegra de la batería Reglas C (110 regresión + 10
# Hallazgo C + 19 ENT + 12 RC = 151 casos, SIN MODIFICAR) +
# bloque nuevo ACCESO ND-2 (ND1–ND19, 19 casos) = 170 casos, en
# el emulador oficial de Firestore (proyecto ficticio
# demo-entrenamiento). El candidato deriva del texto VIVO
# verificado 2026-10-22 (ruleset 2a1e98c1) y su único cambio es
# UN bloque match nuevo (access_log) antes del catch-all: la
# casa de la bitácora ND-2 (requisito vinculante, Ficha 6) —
# append-only: create solo del propietario y solo de sí mismo,
# lectura solo del propietario, update denegado a todos, delete
# solo del propietario para la purga de retención.
# Autorización: empujar esta rama / lanzar este workflow VALIDA
# el candidato; la PUBLICACIÓN de las reglas NO está autorizada
# por este workflow: requerirá la autorización expresa posterior
# y separada de Ronald, por la vía CLI probada, con verificación
# de texto íntegro tras publicar.
# Sin secretos, sin credenciales de producción, sin despliegue.
name: Batería Acceso ND-2 (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/comparador-nd2-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 170 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-acceso-nd2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-entrenamiento "node bateria.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería Acceso ND-2 — resultado'
            grep -E 'SUBTOTAL|RESULTADO|DESGLOSE' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL ·' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-acceso-nd2
          path: |
            tests-acceso-nd2/resultado-bateria.txt
            tests-acceso-nd2/firestore-debug.log
          retention-days: 7
