# RONBO FIT — Batería de reglas del delta AUTH-2026-10-28-072
# «Delegación de la aprobación al entrenador elegido» (diseño
# aprobado por Ronald el 2026-10-28, §4 y §7): la suite AUTH072
# (19 casos N1–N13 + A1–A6) contra el CANDIDATO de reglas
# (texto vivo b71d4fd4…, ruleset 8c3c6e40, + SOLO las dos
# piezas del §4: el bloque match /trainer_notify/{trainerUid}
# tras trainer_profiles y la cláusula allow update de notices
# tras la rama de aprobación N-07 en users; candidato SHA-256
# f91e6f97…) y la MISMA suite contra el texto VIVO con las
# expectativas del delta invertidas (el contraste). Todo
# contra el emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test). Este workflow SOLO valida el texto; NO
# publica reglas ni despliega nada. Sin secretos, sin
# credenciales de producción.
#
# Colocación: este archivo va en .github/workflows/ del repo CI
# y las suites en pruebas-reglas-auth072/ y
# pruebas-reglas-auth072-vivo/ en la raíz del mismo repo, en la
# rama ci/auth072-bateria.
name: Batería AUTH-072 Delegación de aprobación (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/auth072-bateria]

permissions:
  contents: read

jobs:
  auth072-candidato:
    name: Serie AUTH072 (19 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-auth072
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-auth072.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie AUTH072 (19 casos) contra el CANDIDATO — resultado'
            grep -E 'AUTH072-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

  auth072-vivo:
    name: Serie AUTH072 (19 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-auth072-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-auth072.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie AUTH072 (19 casos) contra el texto VIVO — resultado'
            grep -E 'AUTH072-VIVO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
