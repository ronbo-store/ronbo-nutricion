# RONBO NUTRI — Batería del CANDIDATO AISLADO de CONFIRMACIONES
# (35 casos C01–C35 contra el emulador oficial de Firestore,
# proyecto ficticio demo-confirmaciones-v1). Autorización de Ronald
# (2026-10-20 12:22 CDT, decisión N4 del paquete documental):
# ejecutar la batería EN CI, SIN PUBLICAR NADA. La PUBLICACIÓN
# del candidato NO está autorizada por este workflow (checkpoint
# separado, como fue r4). Sin secretos, sin credenciales de
# producción, sin despliegue: solo valida el candidato aislado
# contra datos ficticios.
name: Batería Confirmaciones (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/confirmaciones-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 35 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-confirmaciones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-confirmaciones-v1 "node bateria.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería Confirmaciones — resultado'
            grep -E 'RESULTADO' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL ·' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-confirmaciones
          path: |
            tests-confirmaciones/resultado-bateria.txt
            tests-confirmaciones/firestore-debug.log
          retention-days: 7
