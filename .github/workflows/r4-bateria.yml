# RONBO NUTRI — Batería oficial del CANDIDATO r4 (renovación en
# activo) en el emulador oficial de Firestore (proyecto ficticio
# demo-recibos-r4). Autorización de Ronald (18/10/2026): preparar
# r4, validarla en batería y dejarla lista para publicar. La
# publicación de reglas NO está autorizada por este workflow.
# Sin secretos, sin credenciales de producción, sin despliegue.
name: Batería r4 (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/cuestionario-r4]

permissions:
  contents: read

jobs:
  bateria:
    name: 70 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-r4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-recibos-r4 "node bateria.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-r4
          path: |
            tests-r4/resultado-bateria.txt
            tests-r4/firestore-debug.log
          retention-days: 7
