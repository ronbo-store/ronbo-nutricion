name: Batería de reglas — delta daySummary

# Batería del delta de reglas del resumen diario (punto 18,
# piezas A+B): 'daySummary' entra en la rama de datos inofensivos
# de la escritura propia de users/{uid} con su forma cerrada.
# Delta APROBADO por Ronald el 2026-11-02 12:05 CST
# (widget-15621c42). Corre SOLO en esta rama de CI: el emulador
# oficial de Firestore contra la CANDIDATA (desde
# firestore.rules.candidata en la raíz) y contra el TEXTO VIVO
# (desde firestore.rules.viva-antes en la raíz) con las
# expectativas del delta invertidas. Nada toca producción.

on:
  push:
    branches: [ci/daysummary-bateria]
    paths:
      - 'pruebas-reglas-daysummary/**'
      - 'pruebas-reglas-daysummary-vivo/**'
      - 'firestore.rules.candidata'
      - 'firestore.rules.viva-antes'
      - '.github/workflows/daysummary-bateria.yml'
  workflow_dispatch:

jobs:
  bateria-daysummary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar firebase-tools fijado
        run: npm install -g firebase-tools@15.34.0
      - name: Preparar la suite CANDIDATA
        working-directory: pruebas-reglas-daysummary
        run: |
          cp ../../firestore.rules.candidata firestore.rules
          npm install --no-audit --no-fund
      - name: Batería CANDIDATA (el delta admite la forma cerrada)
        working-directory: pruebas-reglas-daysummary
        run: firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-daysummary.mjs"
      - name: Preparar la suite VIVO
        working-directory: pruebas-reglas-daysummary-vivo
        run: |
          cp ../../firestore.rules.viva-antes firestore.rules
          npm install --no-audit --no-fund
      - name: Batería VIVO (el mismo delta, denegado; lo demás idéntico)
        working-directory: pruebas-reglas-daysummary-vivo
        run: firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-daysummary.mjs"
      - name: Guardar la evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bateria-daysummary
          path: |
            pruebas-reglas-daysummary/firestore.rules
            pruebas-reglas-daysummary-vivo/firestore.rules
          if-no-files-found: ignore
