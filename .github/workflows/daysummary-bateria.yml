name: Batería de reglas — delta daySummary

# Batería del delta de reglas del resumen diario (punto 18,
# piezas A+B): 'daySummary' entra en la rama de datos inofensivos
# de la escritura propia de users/{uid} con su forma cerrada.
# Delta APROBADO por Ronald el 2026-11-02 12:05 CST
# (widget-15621c42). Corre SOLO en esta rama de CI: el emulador
# oficial de Firestore contra la CANDIDATA
# (pruebas-reglas-daysummary/firestore.rules, SHA-256 80f5babf…)
# y contra el TEXTO VIVO (pruebas-reglas-daysummary-vivo/
# firestore.rules, ruleset 6adb18d5, SHA-256 f20a3a6f…) con las
# expectativas del delta invertidas. Nada toca producción.
# Forma calcada de la batería de AUTH-162 (límites), la que sí
# corre en esta casa: reglas dentro de cada suite y npm ci.

on:
  push:
    branches: [ci/daysummary-bateria]
    paths:
      - 'pruebas-reglas-daysummary/**'
      - 'pruebas-reglas-daysummary-vivo/**'
      - 'firestore.rules.candidata'
      - 'firestore.rules.viva-antes'
      - '.github/workflows/daysummary-bateria.yml'
  workflow_dispatch:

jobs:
  daysummary-candidato:
    name: Serie DAYSUMMARY (22 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-daysummary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-daysummary.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie DAYSUMMARY (22 casos) contra el CANDIDATO — resultado'
            grep -E 'DAYSUMMARY-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emitir los fallos como anotaciones (legibles por API)
        if: always()
        shell: bash
        run: |
          grep -E '^FAIL' resultado-bateria.txt | while IFS= read -r l; do echo "::error title=CASO-FAIL::$l"; done || true
          grep -E 'DAYSUMMARY-[A-Z]+:' resultado-bateria.txt | while IFS= read -r l; do echo "::notice title=TOTAL::$l"; done || true
      - name: Publicar el detalle como estado del commit (legible por API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTX: bateria-daysummary/candidato
        run: |
          TOTAL=$(grep -E 'DAYSUMMARY-CANDIDATO:' resultado-bateria.txt | tail -1 || true)
          CODES=$(grep -E '^FAIL' resultado-bateria.txt | grep -oE '(DS|R)[0-9]+' | sort -u | tr '\n' ' ' || true)
          DESC="$TOTAL | FAIL: ${CODES:-ninguno}"
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          if grep -qE 'DAYSUMMARY-CANDIDATO: [0-9]+/[0-9]+ PASS' resultado-bateria.txt && ! grep -qE '^FAIL' resultado-bateria.txt; then ST=success; else ST=failure; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$ST\",\"context\":\"$CTX\",\"description\":\"$DESC\"}" > /dev/null || true

  daysummary-vivo:
    name: Serie DAYSUMMARY (22 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-daysummary-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-daysummary.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie DAYSUMMARY (22 casos) contra el texto VIVO — resultado'
            grep -E 'DAYSUMMARY-VIVO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emitir los fallos como anotaciones (legibles por API)
        if: always()
        shell: bash
        run: |
          grep -E '^FAIL' resultado-bateria.txt | while IFS= read -r l; do echo "::error title=CASO-FAIL::$l"; done || true
          grep -E 'DAYSUMMARY-[A-Z]+:' resultado-bateria.txt | while IFS= read -r l; do echo "::notice title=TOTAL::$l"; done || true
      - name: Publicar el detalle como estado del commit (legible por API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTX: bateria-daysummary/vivo
        run: |
          TOTAL=$(grep -E 'DAYSUMMARY-VIVO:' resultado-bateria.txt | tail -1 || true)
          CODES=$(grep -E '^FAIL' resultado-bateria.txt | grep -oE '(DS|R)[0-9]+' | sort -u | tr '\n' ' ' || true)
          DESC="$TOTAL | FAIL: ${CODES:-ninguno}"
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          if grep -qE 'DAYSUMMARY-VIVO: [0-9]+/[0-9]+ PASS' resultado-bateria.txt && ! grep -qE '^FAIL' resultado-bateria.txt; then ST=success; else ST=failure; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$ST\",\"context\":\"$CTX\",\"description\":\"$DESC\"}" > /dev/null || true
