# RONBO FIT — Batería de reglas del delta «Función de variantes»
# (AUTH-2026-10-31-106; decisiones V-1…V-5 de Ronald 2026-10-30).
# La suite VARIANTES contra el CANDIDATO de reglas (texto vivo
# ruleset 2d83cdb4, SHA-256 098fc990…, + SOLO el delta de 2 líneas
# en exercise_library: 'variantes' en el hasOnly de create y en el
# affectedKeys().hasOnly de update; candidato SHA-256 f02566d7…) y
# la MISMA suite contra el texto VIVO con las expectativas del
# delta invertidas (el contraste).
# Todo contra el emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test). Este workflow SOLO valida el texto; NO publica
# reglas ni despliega nada. Sin secretos, sin credenciales de
# producción.
#
# Colocación: este archivo va en .github/workflows/ del repo y las
# suites en pruebas-reglas-variantes/ y pruebas-reglas-variantes-vivo/
# en la raíz del mismo repo, en la rama ci/variantes-bateria.
name: Batería Función Variantes (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/variantes-bateria]

permissions:
  contents: read

jobs:
  variantes-candidato:
    name: Serie VARIANTES contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-variantes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-variantes.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie VARIANTES contra el CANDIDATO — resultado'
            grep -E 'VARIANTES-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

  variantes-vivo:
    name: Serie VARIANTES contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-variantes-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-variantes.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie VARIANTES contra el texto VIVO — resultado'
            grep -E 'VARIANTES-VIVO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
