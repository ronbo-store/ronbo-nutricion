# RONBO FIT — Batería de reglas del delta «Puerta falsa Business»
# (decisiones de Ronald 2026-10-30 12:00–12:06 CDT: D3 — el sello
# del entrenador en la app, patrón fdCamAt, con su gimnasio
# opcional). La suite FDBIZ (12 casos) contra el CANDIDATO de
# reglas (texto vivo ruleset 9cbf987a, SHA-256 77736abe…, + SOLO
# el delta fdBizAt/fdBizGym en users/{uid}: guardias de create
# «nadie nace interesado», las 2 claves en la lista cerrada de la
# rama de perfil inofensivo y sus guardias de valor; candidato
# SHA-256 0d53712e…) y la MISMA suite contra el texto VIVO con
# las expectativas del delta invertidas (el contraste).
# Todo contra el emulador oficial de Firestore (proyecto
# ficticio ronbo-nutri-test). Este workflow SOLO valida el
# texto; NO publica reglas ni despliega nada. Sin secretos,
# sin credenciales de producción.
#
# Colocación: este archivo va en .github/workflows/ del repo y
# las suites en pruebas-reglas-fdbiz/ y pruebas-reglas-fdbiz-vivo/
# en la raíz del mismo repo, en la rama ci/puerta-business-bateria.
name: Batería Puerta Business fdBiz (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/puerta-business-bateria]

permissions:
  contents: read

jobs:
  fdbiz-candidato:
    name: Serie FDBIZ (12 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-fdbiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fdbiz.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie FDBIZ (12 casos) contra el CANDIDATO — resultado'
            grep -E 'FDBIZ-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

  fdbiz-vivo:
    name: Serie FDBIZ (12 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-fdbiz-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fdbiz.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie FDBIZ (12 casos) contra el texto VIVO — resultado'
            grep -E 'FDBIZ-VIVO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
