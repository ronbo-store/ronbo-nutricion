# RONBO NUTRI — Batería del CANDIDATO ENTRENAMIENTO (2026-10-22):
# regresión íntegra de 120 casos (110 de la batería F-A1 v2 + bloque
# Hallazgo C HC1–HC9, SIN MODIFICAR) + bloque nuevo ENTRENAMIENTO
# (ENT1–ENT19, 19 casos) = 139 casos, en el emulador oficial de
# Firestore (proyecto ficticio demo-entrenamiento). El candidato
# deriva del texto VIVO verificado 2026-10-21 (ruleset a47f9679)
# y su único cambio son los dos bloques match nuevos
# (exercise_library y routine_templates) antes del catch-all.
# Autorización: (1) empujar esta rama / lanzar este workflow
# VALIDA el candidato (implementación autorizada por Ronald el
# 2026-10-22 01:22 CDT); (2) la PUBLICACIÓN de las reglas NO está
# autorizada por este workflow: requerirá su autorización expresa
# posterior y separada, y se hará por la vía CLI ya probada
# (2026-10-21), con verificación de texto íntegro tras publicar.
# Sin secretos, sin credenciales de producción, sin despliegue.
name: Batería Entrenamiento (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/entrenamiento-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 139 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-entrenamiento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-entrenamiento "node bateria.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería Entrenamiento — resultado'
            grep -E 'SUBTOTAL|RESULTADO|DESGLOSE' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL ·' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-entrenamiento
          path: |
            tests-entrenamiento/resultado-bateria.txt
            tests-entrenamiento/firestore-debug.log
          retention-days: 7
