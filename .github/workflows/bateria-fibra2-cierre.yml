name: Batería reglas Fibra2 cierre (emulador)
run-name: "Batería Fibra2 cierre · ${{ github.ref_name }} · ${{ github.sha }}"
on:
  push:
    branches: [ci/fibra2-cierre-bateria]
permissions:
  contents: write
jobs:
  bateria:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-fibra2-cierre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests-fibra2-cierre/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools@15.34.0
      - name: Suite CANDIDATA (delta goalsFib; la sonda de decisión debe pasar)
        run: |
          cp reglas-candidatas.txt firestore.rules
          rm -f fallos.txt progreso.txt
          set +e
          ESPERA_NUEVO=true firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fibra2-cierre.mjs" > salida-candidata.log 2>&1
          echo "suite-candidata exit=$?"
          [ -f fallos.txt ] && cp fallos.txt fallos-candidata.txt || true
          [ -f progreso.txt ] && cp progreso.txt progreso-candidata.txt || true
      - name: Suite CONTROL (reglas vivas de hoy; goalsFib aún no, la sonda debe pasar igual)
        run: |
          cp reglas-vivas.txt firestore.rules
          rm -f fallos.txt progreso.txt
          set +e
          ESPERA_NUEVO=false firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fibra2-cierre.mjs" > salida-control.log 2>&1
          echo "suite-control exit=$?"
          [ -f fallos.txt ] && cp fallos.txt fallos-control.txt || true
          [ -f progreso.txt ] && cp progreso.txt progreso-control.txt || true
      - name: Publicar los registros en la rama (evidencia legible por git)
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p resultados
          for f in salida-candidata.log salida-control.log fallos-candidata.txt fallos-control.txt progreso-candidata.txt progreso-control.txt; do
            if [ -f "tests-fibra2-cierre/$f" ]; then cp "tests-fibra2-cierre/$f" "resultados/$f"; else echo "(ausente)" > "resultados/$f"; fi
          done
          { echo "node: $(node --version 2>&1)"; echo "firebase: $(firebase --version 2>&1 | head -n 1)"; } > resultados/entorno.txt 2>&1 || true
          git config user.name "bateria-ci"
          git config user.email "bateria-ci@ronbo.local"
          git add resultados
          git commit -m "Resultados de la batería (run ${{ github.run_id }})" || echo "sin cambios"
          git push origin HEAD:ci/fibra2-cierre-bateria
      - name: Veredicto
        working-directory: ${{ github.workspace }}
        run: |
          test ! -f tests-fibra2-cierre/fallos-candidata.txt && test ! -f tests-fibra2-cierre/fallos-control.txt
          grep -q "BATERÍA FIBRA2-CIERRE OK — CANDIDATA" tests-fibra2-cierre/salida-candidata.log
          grep -q "BATERÍA FIBRA2-CIERRE OK — VIVAS" tests-fibra2-cierre/salida-control.log
