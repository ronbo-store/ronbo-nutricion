name: Batería reglas Fibra2 cierre (emulador)
run-name: "Batería Fibra2 cierre · ${{ github.ref_name }} · ${{ github.sha }}"
on:
  push:
    branches: [ci/fibra2-cierre-bateria]
permissions:
  contents: read
jobs:
  bateria:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-fibra2-cierre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests-fibra2-cierre/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm install -g firebase-tools@15.34.0
      - name: Entorno (diagnóstico ronda 3)
        run: |
          { echo "node: $(node --version 2>&1)"; echo "java: $(java -version 2>&1 | head -n 1)"; echo "firebase: $(firebase --version 2>&1 | head -n 1)"; echo "archivos:"; ls -la; } > entorno.log 2>&1 || true
          cat entorno.log
      - name: Suite CANDIDATA (delta goalsFib; la sonda de decisión debe pasar)
        run: |
          cp reglas-candidatas.txt firestore.rules
          rm -f fallos.txt progreso.txt
          set +e
          ESPERA_NUEVO=true firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fibra2-cierre.mjs" > salida-candidata.log 2>&1
          echo "suite-candidata exit=$?"
          [ -f fallos.txt ] && cp fallos.txt fallos-candidata.txt || true
          [ -f progreso.txt ] && cp progreso.txt progreso-candidata.txt || true
      - name: Suite CONTROL (reglas vivas de hoy; goalsFib aún no, la sonda debe pasar igual)
        run: |
          cp reglas-vivas.txt firestore.rules
          rm -f fallos.txt progreso.txt
          set +e
          ESPERA_NUEVO=false firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-fibra2-cierre.mjs" > salida-control.log 2>&1
          echo "suite-control exit=$?"
          [ -f fallos.txt ] && cp fallos.txt fallos-control.txt || true
          [ -f progreso.txt ] && cp progreso.txt progreso-control.txt || true
      - name: Diagnóstico y veredicto
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          cd tests-fibra2-cierre
          for f in fallos-candidata.txt fallos-control.txt; do
            if [ -f "$f" ]; then sed 's/^/::error ::/' "$f"; fi
          done
          echo "::error ::ENTORNO>"
          if [ -f entorno.log ]; then tail -n 8 entorno.log | sed 's/[^[:print:]]//g' | cut -c1-200 | sed 's/^/::error ::ENV ::/'; else echo "::error ::ENV sin-entorno.log"; fi
          for f in salida-candidata.log salida-control.log; do
            echo "::error ::COLA $f>"
            if [ -f "$f" ]; then tail -n 8 "$f" | sed 's/[^[:print:]]//g' | cut -c1-200 | sed 's/^/::error ::LOG ::/'; else echo "::error ::LOG sin-$f"; fi
          done
          test ! -f fallos-candidata.txt && test ! -f fallos-control.txt
          grep -q "BATERÍA FIBRA2-CIERRE OK — CANDIDATA" salida-candidata.log
          grep -q "BATERÍA FIBRA2-CIERRE OK — VIVAS" salida-control.log
