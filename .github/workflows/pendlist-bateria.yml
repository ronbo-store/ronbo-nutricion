# RONBO FIT — Batería oficial del delta de reglas «sello del
# mensaje combinado de pendientes» (paquete 2026-11-03) en el
# emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test): suites gemelas contra la CANDIDATA y contra
# el texto VIVO, con las expectativas del sello nuevo invertidas
# en el vivo. Sin secretos, sin credenciales de producción, sin
# despliegue: la publicación de reglas va por la ruta probada
# (CLI con token, desde la carpeta del paquete), nunca desde
# este workflow.
name: Batería pendlist (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/pendlist-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 16 casos x2 (candidata y vivo) contra el emulador oficial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-pendlist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Suite CANDIDATA (el sello «all» se comporta como se diseñó)
        run: |
          cp firestore.rules.candidata firestore.rules
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=true node test-pendlist.mjs"
      - name: Suite VIVO (la subclave «all» no existe; vecinos idénticos)
        run: |
          cp firestore.rules.viva firestore.rules
          firebase emulators:exec --only firestore --project ronbo-nutri-test "ESPERA_NUEVO=false node test-pendlist.mjs"
