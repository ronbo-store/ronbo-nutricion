# RONBO FIT — Batería de reglas del delta «Límites» (punto 12 de
# la cola de despliegue 2026-11-01; delta aprobado por Ronald
# 2026-11-02 09:04 CST). La suite LIMITES (19 casos) contra el
# CANDIDATO de reglas (texto vivo ruleset d2cdb249, SHA-256
# 6df936f1…, + SOLO el bloque nuevo match /app_settings/limits,
# réplica del precedente mail_templates de AUTH-146; candidata
# SHA-256 f20a3a6f…) y la MISMA suite contra el texto VIVO con
# las expectativas del delta invertidas (L1, L2 y L3 denegados
# allí).
# Todo contra el emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test). Este workflow SOLO valida el texto; NO publica
# reglas ni despliega nada. Sin secretos, sin credenciales de
# producción.
#
# Colocación: este archivo va en .github/workflows/ del repo y las
# suites en pruebas-reglas-limites/ y pruebas-reglas-limites-vivo/
# en la raíz del mismo repo, en la rama ci/limites-bateria.
name: Batería Límites (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/limites-bateria]

permissions:
  contents: read
  statuses: write

jobs:
  limites-candidato:
    name: Serie LIMITES (19 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-limites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-limites.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie LIMITES (19 casos) contra el CANDIDATO — resultado'
            grep -E 'LIMITES-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emitir los fallos como anotaciones (legibles por API)
        if: always()
        shell: bash
        run: |
          grep -E '^FAIL' resultado-bateria.txt | while IFS= read -r l; do echo "::error title=CASO-FAIL::$l"; done || true
          grep -E 'LIMITES-[A-Z]+:' resultado-bateria.txt | while IFS= read -r l; do echo "::notice title=TOTAL::$l"; done || true
      - name: Publicar el detalle como estado del commit (legible por API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTX: bateria-limites/candidato
        run: |
          TOTAL=$(grep -E 'LIMITES-CANDIDATO:' resultado-bateria.txt | tail -1 || true)
          CODES=$(grep -E '^FAIL' resultado-bateria.txt | grep -oE 'LIMITES [LR][0-9]+' | sort -u | tr '\n' ' ' || true)
          DESC="$TOTAL | FAIL: ${CODES:-ninguno}"
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          if grep -qE 'LIMITES-CANDIDATO: [0-9]+/[0-9]+ PASS' resultado-bateria.txt && ! grep -qE '^FAIL' resultado-bateria.txt; then ST=success; else ST=failure; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$ST\",\"context\":\"$CTX\",\"description\":\"$DESC\"}" > /dev/null || true

  limites-vivo:
    name: Serie LIMITES (19 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-limites-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-limites.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie LIMITES (19 casos) contra el texto VIVO — resultado'
            grep -E 'LIMITES-VIVO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emitir los fallos como anotaciones (legibles por API)
        if: always()
        shell: bash
        run: |
          grep -E '^FAIL' resultado-bateria.txt | while IFS= read -r l; do echo "::error title=CASO-FAIL::$l"; done || true
          grep -E 'LIMITES-[A-Z]+:' resultado-bateria.txt | while IFS= read -r l; do echo "::notice title=TOTAL::$l"; done || true
      - name: Publicar el detalle como estado del commit (legible por API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTX: bateria-limites/vivo
        run: |
          TOTAL=$(grep -E 'LIMITES-VIVO:' resultado-bateria.txt | tail -1 || true)
          CODES=$(grep -E '^FAIL' resultado-bateria.txt | grep -oE 'LIMITES [LR][0-9]+' | sort -u | tr '\n' ' ' || true)
          DESC="$TOTAL | FAIL: ${CODES:-ninguno}"
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          if grep -qE 'LIMITES-VIVO: [0-9]+/[0-9]+ PASS' resultado-bateria.txt && ! grep -qE '^FAIL' resultado-bateria.txt; then ST=success; else ST=failure; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$ST\",\"context\":\"$CTX\",\"description\":\"$DESC\"}" > /dev/null || true
