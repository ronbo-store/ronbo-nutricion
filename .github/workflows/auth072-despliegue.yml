# RONBO FIT — REGRESIÓN de reglas previa a publicar el delta
# AUTH-2026-10-28-072 «Delegación de la aprobación al entrenador
# elegido» (diseño §7: «Regresión obligatoria: suites AUTH-068
# (F1–F10 + contraste vivo) y la de la bandeja N-07 verdes» —
# la sección N-07 vive en tests-linea-completa/test-candidato.mjs).
#
# En esta rama (ci/auth072-despliegue) el firestore.rules de
# pruebas-reglas-auth068/ y de tests-linea-completa/ es el
# CANDIDATO AUTH-072 (SHA-256 f91e6f97…: texto vivo b71d4fd4… +
# SOLO las dos piezas del delta). Las expectativas de ambas
# suites quedan INTACTAS: si el delta rompiera el comportamiento
# AUTH-068 (emailConfirmedAt) o la bandeja N-07 (aprobación por
# entrenador con límite), esta corrida lo caza ANTES de publicar.
# Las suites AUTH072 gemelas ya corrieron verdes contra este
# mismo candidato y su contraste vivo (run 40768827061).
#
# Todo contra el emulador oficial de Firestore (proyecto
# ficticio ronbo-nutri-test). Este workflow SOLO valida; NO
# publica reglas ni despliega nada. Sin secretos.
name: Regresión AUTH-072 despliegue (AUTH-068 + línea completa N-07 sobre el candidato)

on:
  workflow_dispatch:
  push:
    branches: [ci/auth072-despliegue]

permissions:
  contents: read

jobs:
  auth068-sobre-candidata072:
    name: Suite AUTH-068 (10 casos) contra el CANDIDATO AUTH-072
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-auth068
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-auth068.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Suite AUTH-068 contra el CANDIDATO AUTH-072 — resultado'
            grep -E 'AUTH068:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

  linea-completa-sobre-candidata072:
    name: Línea completa (con la sección N-07) contra el CANDIDATO AUTH-072
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-linea-completa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-candidato.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Línea completa (N-07) contra el CANDIDATO AUTH-072 — resultado'
            grep -E 'RESULTADO CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
