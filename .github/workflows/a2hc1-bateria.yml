# RONBO NUTRI — Compatibilidad A2 x reglas activas H-C1 en el
# emulador oficial (proyecto ficticio demo-a2hc1). Autorización de
# Ronald 16/10/2026 19:44 CDT: revisión y comprobaciones en
# entorno aislado. Sin secretos ni producción.
name: Batería A2×H-C1 (emulador oficial)
on:
  workflow_dispatch:
  push:
    branches: [ci/a2-hc1-compat]
permissions:
  contents: read
jobs:
  bateria:
    name: 10 casos contra el emulador oficial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-a2hc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-a2hc1 "node bateria.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-a2hc1
          path: |
            tests-a2hc1/resultado-bateria.txt
            tests-a2hc1/firestore-debug.log
          retention-days: 7
