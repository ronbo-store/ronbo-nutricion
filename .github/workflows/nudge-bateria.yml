# RONBO FIT — Batería de reglas del delta «registro del aviso por
# pendiente» (AUTH-2026-11-01-133; diseño aprobado 2026-10-31 +
# decisiones D1–D4 de Ronald 2026-11-01: solo correo, tope 1 por
# pendiente cada 7 días, con registro, banco fijo). La suite NUDGE
# (16 casos) corre contra el CANDIDATO de reglas (texto vivo ruleset
# 873cb76c…, SHA-256 718f411f…, + SOLO la rama nueva «nudge» de la
# cláusula de notices en users/{uid}: el entrenador ASIGNADO anota
# el aviso en notices.nudge con sus 8 subclaves cerradas {at, by};
# candidata SHA-256 5525d2f2…) y la MISMA suite contra el texto VIVO
# con la expectativa de N1 invertida (el contraste: hoy un
# entrenador NO puede anotar avisos).
# Todo contra el emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test). Este workflow SOLO valida el texto; NO publica
# reglas ni despliega nada. Sin secretos, sin credenciales de
# producción, sin despliegue: solo lectura de código.
# Patrón probado de la casa (AUTH-132): dependencias con npm ci y
# el CLI de Firebase GLOBAL fijado (npm install -g
# firebase-tools@15.34.0); cada job sale con código 1 ante
# cualquier fallo y corre con pipefail: job verde == suite
# completa.
name: nudge-bateria

on:
  push:
    branches: [ci/nudge-bateria]
    paths:
      - 'pruebas-reglas-nudge/**'
      - '.github/workflows/nudge-bateria.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nudge-bateria
  cancel-in-progress: false

jobs:
  candidata:
    name: Suite NUDGE contra la CANDIDATA (rama nudge permitida)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-nudge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar dependencias de la suite
        run: npm ci --no-audit --no-fund
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: La CANDIDATA es el texto bajo prueba
        run: cp candidata.rules firestore.rules
      - name: Correr la suite (espera la rama nudge PERMITIDA)
        shell: bash
        env:
          NUDGE_MODE: candidata
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-nudge.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Suite NUDGE contra la CANDIDATA — resultado'
            grep -E '^MODO=' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar las líneas de la suite como anotaciones
        if: always()
        shell: bash
        run: |
          grep -E '^(PASS|FAIL|MODO)' resultado-bateria.txt | head -10 | while IFS= read -r l; do echo "::notice::$l"; done || true
          grep -E '^(PASS|FAIL|MODO)' resultado-bateria.txt | tail -n +11 | head -10 | while IFS= read -r l; do echo "::notice::$l"; done || true

  contraste-vivo:
    name: La MISMA suite contra el texto VIVO (N1 invertido)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-nudge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar dependencias de la suite
        run: npm ci --no-audit --no-fund
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: El texto VIVO es el texto bajo prueba
        run: cp vivas-antes.rules firestore.rules
      - name: Correr la suite (N1 debe FALLAR con el texto vivo)
        shell: bash
        env:
          NUDGE_MODE: vivo
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-nudge.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Suite NUDGE contra el texto VIVO — resultado'
            grep -E '^MODO=' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar las líneas de la suite como anotaciones
        if: always()
        shell: bash
        run: |
          grep -E '^(PASS|FAIL|MODO)' resultado-bateria.txt | head -10 | while IFS= read -r l; do echo "::notice::$l"; done || true
          grep -E '^(PASS|FAIL|MODO)' resultado-bateria.txt | tail -n +11 | head -10 | while IFS= read -r l; do echo "::notice::$l"; done || true
