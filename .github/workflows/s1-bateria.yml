# RONBO NUTRI — Batería S-1 (mitigación del hallazgo S-1)
# 17 casos contra el emulador oficial de Firestore (proyecto
# ficticio ronbo-nutri-test), en la vía CI del proyecto (la misma
# que validó el candidato P8 con CI 170 y la línea completa).
# Corrida original: copia byte-idéntica de
# preparacion-local/firestore.rules.candidato-s1-2026-10-23.rules
# (SHA-256 a292011a…; delta SOLO S-1 sobre el texto vivo e5efaef2).
# Corrida 2026-10-24 (UX10): la batería corre sobre el texto final
# compuesto preparacion-local/firestore.rules.candidato-actividad-final-2026-10-24.rules
# (SHA-256 e114e69c…), que conserva el delta S-1 íntegro.
#
# INSTALACIÓN (paso futuro, junto con la composición/publicación):
# este archivo va en .github/workflows/s1-bateria.yml de una rama
# ci/s1-bateria que contenga además la carpeta pruebas-reglas-s1/
# en la raíz del repo. La rama la crea y la empuja la coordinación
# cuando Ronald autorice la composición y publicación — ESTE
# workflow SOLO valida el candidato; no publica reglas.
# Sin secretos, sin credenciales de producción, sin despliegue.
name: Batería S-1 (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/s1-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 17 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-s1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-s1.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería S-1 — resultado'
            grep -E 'RESULTADO S-1' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL — ' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-s1
          path: |
            pruebas-reglas-s1/resultado-bateria.txt
            pruebas-reglas-s1/firestore-debug.log
          retention-days: 7
