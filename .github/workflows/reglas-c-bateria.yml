# RONBO NUTRI — Batería del CANDIDATO REGLAS C (2026-10-22):
# la suite íntegra de la batería Entrenamiento (110 regresión +
# 10 Hallazgo C + 19 ENT = 139 casos, SIN MODIFICAR) + bloque
# nuevo REGLAS C (RC1–RC12, 12 casos) = 151 casos, en el
# emulador oficial de Firestore (proyecto ficticio
# demo-entrenamiento). El candidato deriva del texto VIVO
# verificado 2026-10-22 (ruleset 1911f450) y su único cambio es
# UN bloque match nuevo (body_type_ratings) antes del catch-all:
# lectura solo aprobados, escritura de cliente denegada siempre.
# Decisión del propietario (2026-10-22 02:49 CDT): los datos C
# viven en colección propia (opción (b)).
# Autorización: empujar esta rama / lanzar este workflow VALIDA
# el candidato; la PUBLICACIÓN de las reglas NO está autorizada
# por este workflow: requerirá la autorización expresa posterior
# y separada de Ronald, por la vía CLI probada, con verificación
# de texto íntegro tras publicar.
# Sin secretos, sin credenciales de producción, sin despliegue.
name: Batería Reglas C (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/reglas-c-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: 151 casos contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-reglas-c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-entrenamiento "node bateria.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería Reglas C — resultado'
            grep -E 'SUBTOTAL|RESULTADO|DESGLOSE' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL ·' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-reglas-c
          path: |
            tests-reglas-c/resultado-bateria.txt
            tests-reglas-c/firestore-debug.log
          retention-days: 7
