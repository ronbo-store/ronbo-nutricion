        with:
          name: evidencia-regresion-linea-metas
          path: |
            tests-linea-completa/resultado-bateria.txt
            tests-linea-completa/firestore-debug.log
          retention-days: 7

  regresion-s1:
    name: Regresión S-1 (17 casos) contra el MISMO candidato
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-s1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
