# RONBO NUTRI — Batería de reglas del paquete «Metas con
# fundamento»: 45 casos NUEVOS (series A y G) contra el candidato
# de publicación, MÁS la regresión completa de la batería de reglas
# vigente en la última publicación (Biblioteca Comunitaria, 45
# casos) y las regresiones de línea (49) y S-1 (17) que la cadena
# del 2026-10-24 corrió junto a cada paquete. Todo contra el
# emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test). El texto probado en las CUATRO suites es el
# MISMO candidato: texto vivo verificado 0d752923 (SHA-256
# 75c2033ffb8799f4afe2c4aaada90e4c6094a7906bb7ce1fa8cf7e61f590a775)
# + SOLO el delta de metas (preparacion-local/
# firestore.rules.candidato-metas-2026-10-26.rules, SHA-256
# dd25a14f1dd6d75492954d3d056be61d84fd55c2ddb1c2a238fbcda83747b0c5).
# Este workflow SOLO valida el texto; NO publica reglas ni
# despliega nada. Sin secretos, sin credenciales de producción.
name: Batería Metas con Fundamento (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/metas-bateria]

permissions:
  contents: read

jobs:
  metas:
    name: Serie Metas (45 casos) contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-metas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-metas.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería Metas con Fundamento — resultado'
            grep -E 'METAS CON FUNDAMENTO:' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL — ' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el detalle como anotaciones (legibles por API pública)
        if: always()
        shell: bash
        run: |
          grep -E 'METAS CON FUNDAMENTO:' resultado-bateria.txt | sed 's/^/::notice title=RESULTADO::/' || true
          grep -E '^FAIL — ' resultado-bateria.txt | sed 's/^FAIL — /::error title=FAIL::/' || true
          echo "::error title=HEAD::$(head -c 800 resultado-bateria.txt | tr '\n' '|')" || true
          echo "::error title=TAIL::$(tail -c 1200 resultado-bateria.txt | tr '\n' '|')" || true
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-metas
          path: |
            pruebas-reglas-metas/resultado-bateria.txt
            pruebas-reglas-metas/firestore-debug.log
          retention-days: 7

  regresion-libcom:
    name: Regresión Biblioteca Comunitaria (45 casos) contra el MISMO candidato
    runs-on: ubuntu-24.04
    timeout-minutes: 20
