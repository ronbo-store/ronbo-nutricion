        run: |
          {
            echo '## Regresión Biblioteca Comunitaria — resultado'
            grep -E 'BIBLIOTECA COMUNITARIA:' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL — ' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar la evidencia (salida de la batería)
        if: always()
