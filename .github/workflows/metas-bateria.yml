        with:
          name: evidencia-regresion-libcom-metas
          path: |
            pruebas-reglas-libcom/resultado-bateria.txt
            pruebas-reglas-libcom/firestore-debug.log
          retention-days: 7

  regresion-linea:
    name: Regresión Línea Completa (49 aserciones) contra el MISMO candidato
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-linea-completa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-candidato.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Regresión Línea Completa — resultado'
            grep -E 'RESULTADO|PASS ·|FAIL' resultado-bateria.txt | tail -5 || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL' resultado-bateria.txt || echo '(ninguno)'
