# RONBO FIT — Batería de reglas del delta «Repetir día / Repetir
# semana» (2026-10-29): autoría propia del alumno SIN entrenador
# (Q4). La suite REPETIR (21 casos R1–R21) contra el CANDIDATO
# (texto vivo f91e6f97…, ruleset f5352f7c, + helper
# selfAuthorNoTrainer y la rama de autoría propia en create/
# update de match /training_plans/{docId}; candidato SHA-256
# cba128f2…) y la MISMA suite contra el texto VIVO con las
# expectativas de R1/R2/R3/R21 invertidas (el contraste). La
# superficie Q5 (R18–R20) corre idéntica en ambas: no necesita
# delta. Todo contra el emulador oficial de Firestore (proyecto
# ficticio ronbo-nutri-test). Este workflow SOLO valida el texto;
# NO publica reglas ni despliega nada. Sin secretos, sin
# credenciales de producción.
#
# Colocación: este archivo va en .github/workflows/ del repo CI
# y las suites en pruebas-reglas-repetir/ y
# pruebas-reglas-repetir-vivo/ en la raíz del mismo repo, en la
# rama ci/repetir-bateria.
name: Batería Repetir — Autoría propia Q4 (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/repetir-bateria]

permissions:
  contents: read

jobs:
  repetir-candidato:
    name: Serie REPETIR (21 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-repetir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-repetir.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie REPETIR (21 casos) contra el CANDIDATO — resultado'
            grep -E 'REPETIR-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

  repetir-vivo:
    name: Serie REPETIR (21 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-repetir-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-repetir.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie REPETIR (21 casos) contra el texto VIVO — resultado'
            grep -E 'REPETIR-VIVO' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
