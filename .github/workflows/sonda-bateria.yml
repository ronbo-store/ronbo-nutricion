# RONBO NUTRI — Batería de la sonda de época de reglas (ventana D→E)
# en el emulador oficial de Firestore (proyectos ficticios
# demo-sonda-hc1 y demo-sonda-r3). Autorización de Ronald 16/10/2026:
# preparación y pruebas en aislamiento. Sin secretos, sin credenciales
# de producción, sin despliegue.
name: Batería sonda D→E (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/sonda-epoca]

permissions:
  contents: read

jobs:
  bateria:
    name: 8 casos contra el emulador oficial (proyectos ficticios)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests-sonda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-sonda-epoca "node bateria-sonda.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-sonda
          path: |
            tests-sonda/resultado-bateria.txt
            tests-sonda/firestore-debug.log
          retention-days: 7
