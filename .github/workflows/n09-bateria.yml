# RONBO NUTRI — Batería de reglas de las preferencias de actividad
# (rediseño flotante): 14 casos PREF contra el emulador oficial de
# Firestore (proyecto ficticio ronbo-nutri-test), en la vía CI del
# proyecto. El texto probado es el FINAL compuesto para producción:
# texto vivo verificado cae26a6c (2026-10-24, roles+dossier) + SOLO
# el bloque preferences/{docId} 'activities' del candidato de
# actividad flotante: preparacion-local/firestore.rules.candidato-
# actividad-flotante-FINAL-2026-10-24.rules, SHA-256
# 729c737d5e386fc3b89537cc2662c434c4937dcae30e82c72c94e7c10e37e3a6.
# Despliegue autorizado por Ronald por correo (memphis) el
# 2026-10-24 16:27 CDT («Despliega todo lo que esté completo y
# validado en desarrollo, en el orden obligatorio», id
# 1a16fcf84fe6ed77; cadena AUTH-2026-10-24-015); este workflow SOLO
# valida el texto; no publica reglas ni despliega nada.
# Sin secretos, sin credenciales de producción, sin despliegue.
name: Batería N-09 (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/n09-bateria]

permissions:
  contents: read

jobs:
  bateria:
    name: Casos N-09 contra el emulador oficial (proyecto ficticio)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-n09
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-n09.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job (legible por API)
        if: always()
        shell: bash
        run: |
          {
            echo '## Batería actividad-flotante — resultado'
            grep -E 'REGLAS ACTIVIDAD FLOTANTE:' resultado-bateria.txt || true
            echo ''
            echo '### Casos FAIL (si los hay)'
            grep -E '^FAIL — ' resultado-bateria.txt || echo '(ninguno)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el detalle como anotaciones (legibles por API pública)
        if: always()
        shell: bash
        run: |
          grep -E 'REGLAS ACTIVIDAD FLOTANTE:' resultado-bateria.txt | sed 's/^/::notice title=RESULTADO::/' || true
          grep -E '^FAIL — ' resultado-bateria.txt | sed 's/^FAIL — /::error title=FAIL::/' || true
          echo "::error title=HEAD::$(head -c 800 resultado-bateria.txt | tr '\n' '|')" || true
          echo "::error title=TAIL::$(tail -c 1200 resultado-bateria.txt | tr '\n' '|')" || true
      - name: Conservar la evidencia (salida de la batería)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bateria-actividad-flotante
          path: |
            pruebas-reglas-n09/resultado-bateria.txt
            pruebas-reglas-n09/firestore-debug.log
          retention-days: 7
