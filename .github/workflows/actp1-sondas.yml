name: actp1-sondas
on:
  push:
    branches: [ci/actp1-sondas]
jobs:
  sondas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-actp1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Generar variantes
        run: python3 make-sondas.py
      - name: Correr sondas P0, P1, P2 y completa
        run: |
          for v in sondaP0 sondaP1 sondaP2 candidata; do
            cp firestore.rules.$v firestore.rules
            echo "════ $v ════" >> /tmp/sondas.log
            firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-variante.mjs" 2>&1 | grep -a "SONDA" >> /tmp/sondas.log || true
          done
          cat /tmp/sondas.log
      - name: Publicar sondas en la rama de resultados
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/resrepo
          git clone --depth 1 --branch ci/actp1-resultados "https://x-access-token:${GH_TOKEN}@github.com/ronbo-store/ronbo-nutricion.git" /tmp/resrepo 2>/dev/null \
            || git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/ronbo-store/ronbo-nutricion.git" /tmp/resrepo
          cd /tmp/resrepo
          git checkout -B ci/actp1-resultados
          mkdir -p tests-actp1
          {
            echo "Sondas: ${{ github.run_id }} · ${{ github.sha }} · $(date -u +%FT%TZ)"
            cat /tmp/sondas.log 2>/dev/null || echo "(sin salida)"
          } > tests-actp1/resultado-sondas.txt
          git config user.email "ci@ronbo.local"
          git config user.name "CI sondas actp1"
          git add tests-actp1/resultado-sondas.txt
          git commit -m "Sondas actp1 (corrida ${{ github.run_id }}) [skip ci]" || echo "sin cambios"
          git push origin HEAD:ci/actp1-resultados
