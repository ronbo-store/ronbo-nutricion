# RONBO FIT — Batería de reglas del delta «Elección obligatoria de
# propósito al registrarse» (AUTH-2026-11-01-145; diseño de Ronald
# 2026-11-01 y sus cuatro decisiones del mismo día). La suite
# PROPÓSITO (15 casos) contra el CANDIDATO de reglas (texto vivo
# ruleset 2ad00641, SHA-256 5525d2f2…, + SOLO dos deltas cerrados:
# siete claves de declaración de propósito con guardas de valor en
# la rama de perfil inofensivo de users/{uid}, y el nivel «prueba»
# en la lista de requestedLevel de la solicitud propia de
# memberships; candidata SHA-256 06aba677…) y la MISMA suite contra
# el texto VIVO con las expectativas del delta invertidas (P1, P9
# y P15 denegados allí).
# Todo contra el emulador oficial de Firestore (proyecto ficticio
# ronbo-nutri-test). Este workflow SOLO valida el texto; NO publica
# reglas ni despliega nada. Sin secretos, sin credenciales de
# producción.
#
# Colocación: este archivo va en .github/workflows/ del repo y las
# suites en pruebas-reglas-proposito/ y pruebas-reglas-proposito-vivo/
# en la raíz del mismo repo, en la rama ci/proposito-bateria.
name: Batería Propósito Registro (emulador oficial)

on:
  workflow_dispatch:
  push:
    branches: [ci/proposito-bateria]

permissions:
  contents: read

jobs:
  proposito-candidato:
    name: Serie PROPÓSITO (15 casos) contra el CANDIDATO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-proposito
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-proposito.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie PROPÓSITO (15 casos) contra el CANDIDATO — resultado'
            grep -E 'PROPOSITO-CANDIDATO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emitir los fallos como anotaciones (legibles por API)
        if: always()
        shell: bash
        run: |
          grep -E '^FAIL' resultado-bateria.txt | while IFS= read -r l; do echo "::error title=CASO-FAIL::$l"; done || true
          grep -E 'PROPOSITO-[A-Z]+:' resultado-bateria.txt | while IFS= read -r l; do echo "::notice title=TOTAL::$l"; done || true
      - name: Publicar el detalle como estado del commit (legible por API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTX: bateria-proposito/candidato
        run: |
          TOTAL=$(grep -E 'PROPOSITO-CANDIDATO:' resultado-bateria.txt | tail -1 || true)
          CODES=$(grep -E '^FAIL' resultado-bateria.txt | grep -oE 'PROPOSITO P[0-9]+' | sort -u | tr '\n' ' ' || true)
          DESC="$TOTAL | FAIL: ${CODES:-ninguno}"
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          if grep -qE 'PROPOSITO-CANDIDATO: [0-9]+/[0-9]+ PASS' resultado-bateria.txt && ! grep -qE '^FAIL' resultado-bateria.txt; then ST=success; else ST=failure; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$ST\",\"context\":\"$CTX\",\"description\":\"$DESC\"}" > /dev/null || true

  proposito-vivo:
    name: Serie PROPÓSITO (15 casos) contra el texto VIVO (contraste)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pruebas-reglas-proposito-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias de la batería (versiones fijadas)
        run: npm ci
      - name: Instalar Firebase CLI (versión fijada)
        run: npm install -g firebase-tools@15.34.0
      - name: Ejecutar la batería contra el emulador oficial
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project ronbo-nutri-test "node test-proposito.mjs" 2>&1 | tee resultado-bateria.txt
      - name: Publicar el resultado en el resumen del job
        if: always()
        shell: bash
        run: |
          {
            echo '## Serie PROPÓSITO (15 casos) contra el texto VIVO — resultado'
            grep -E 'PROPOSITO-VIVO:' resultado-bateria.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emitir los fallos como anotaciones (legibles por API)
        if: always()
        shell: bash
        run: |
          grep -E '^FAIL' resultado-bateria.txt | while IFS= read -r l; do echo "::error title=CASO-FAIL::$l"; done || true
          grep -E 'PROPOSITO-[A-Z]+:' resultado-bateria.txt | while IFS= read -r l; do echo "::notice title=TOTAL::$l"; done || true
      - name: Publicar el detalle como estado del commit (legible por API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTX: bateria-proposito/vivo
        run: |
          TOTAL=$(grep -E 'PROPOSITO-VIVO:' resultado-bateria.txt | tail -1 || true)
          CODES=$(grep -E '^FAIL' resultado-bateria.txt | grep -oE 'PROPOSITO P[0-9]+' | sort -u | tr '\n' ' ' || true)
          DESC="$TOTAL | FAIL: ${CODES:-ninguno}"
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          if grep -qE 'PROPOSITO-VIVO: [0-9]+/[0-9]+ PASS' resultado-bateria.txt && ! grep -qE '^FAIL' resultado-bateria.txt; then ST=success; else ST=failure; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$ST\",\"context\":\"$CTX\",\"description\":\"$DESC\"}" > /dev/null || true

